<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Attendance Manager" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Attendance Manager</title>
    <meta name="description" content="Comprehensive school attendance, class roster management, student performance tracking, and analytics app for teachers and educators." />
    <meta property="og:title" content="Attendance Manager" />
    <meta property="og:description" content="Comprehensive school attendance, class roster management, student performance tracking, and analytics app for teachers and educators." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    <style>
      /* Critical Anti-Glitch CSS: Prevents raw icon ligature strings (e.g. 'fact_check', 'notifications') from flashing as raw text before font finishes loading */
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        user-select: none;
      }
      html:not(.fonts-loaded) .material-symbols-outlined {
        color: transparent !important;
        text-shadow: none !important;
        overflow: hidden !important;
      }
    </style>
    <script>
      (function() {
        try {
          if ('fonts' in document) {
            Promise.all([
              document.fonts.load('24px "Material Symbols Outlined"'),
              document.fonts.ready
            ]).then(function() {
              document.documentElement.classList.add('fonts-loaded');
            }).catch(function() {
              document.documentElement.classList.add('fonts-loaded');
            });
            setTimeout(function() {
              document.documentElement.classList.add('fonts-loaded');
            }, 800);
          } else {
            document.documentElement.classList.add('fonts-loaded');
          }
        } catch (e) {
          document.documentElement.classList.add('fonts-loaded');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F4F7FC] text-[#0B1C30] antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
