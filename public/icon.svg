<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#004AC6" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00174B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle for Android adaptive / Play Store style -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner subtle glow ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />

  <!-- Graduation Cap Icon & Checklist Graphic -->
  <g filter="url(#dropShadow)" transform="translate(48, 56) scale(0.82)">
    <!-- Graduation Cap Top diamond -->
    <path d="M256 60 L460 160 L256 260 L52 160 Z" fill="url(#capGrad)" />

    <!-- Cap Skull Base -->
    <path d="M120 200 L120 310 C120 360 392 360 392 310 L392 200 L256 266 Z" fill="#DAE2FD" />

    <!-- Tassel String & Ball -->
    <path d="M390 190 L430 280 L420 350 L440 350 L430 280" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="430" cy="355" r="14" fill="#F59E0B" />

    <!-- Checklist badge container -->
    <rect x="136" y="270" width="240" height="150" rx="24" fill="#FFFFFF" />
    
    <!-- Checklist items inside badge -->
    <circle cx="180" cy="315" r="14" fill="#10B981" />
    <path d="M174 315 L178 319 L186 311" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="206" y="308" width="130" height="14" rx="7" fill="#E2E8F0" />

    <circle cx="180" cy="365" r="14" fill="#2563EB" />
    <path d="M174 365 L178 369 L186 361" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="206" y="358" width="100" height="14" rx="7" fill="#E2E8F0" />
  </g>
</svg>
